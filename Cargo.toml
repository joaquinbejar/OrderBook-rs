[package]
name = "orderbook-rs"
version = "0.15.0"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "A high-performance, lock-free price level implementation for limit order books in Rust. This library provides the building blocks for creating efficient trading systems with support for multiple order types and concurrent access patterns."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/OrderBook-rs"
homepage = "https://github.com/joaquinbejar/OrderBook-rs"
keywords = ["finance", "orderbook", "trading"]
categories = ["finance", "data-structures"]
autobenches = false


include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*.png",
    "Docker/**/*.Dockerfile",
    "Docker/**/*.yml",
]

# Production Panic Policy gate (issue #242, ported from PriceLevel's issue
# #173; absolute since #260). This table is package-wide: it applies to
# every target of THIS package (`src/lib.rs`, the `tests` / `alloc_budget` /
# `bincode_decode_bounds` / `metrics_tests` / `fee_tests` integration-test
# binaries, and the `benches` / `*_hdr` / `alloc_count` bench binaries), not
# to the separate `examples` workspace member.
#
# `clippy.toml` (`allow-unwrap-in-tests` / `allow-expect-in-tests` /
# `allow-panic-in-tests` / `allow-indexing-slicing-in-tests`) narrows
# `unwrap_used`, `expect_used`, `panic`, `indexing_slicing` and `string_slice`
# so clippy's own `#[cfg(test)]` / `#[test]` detection exempts real test items
# (co-located `#[cfg(test)] mod tests { ... }` blocks directly inside a
# production file, the `src/orderbook/tests/` and `src/utils/tests/`
# co-located test-module trees, and every `tests/` integration target, which
# compiles with `cfg(test)` as a whole). It does NOT exempt a standalone
# `#[cfg(test)] fn` production helper that lives outside a `mod tests {}`
# block: clippy's heuristic is per-item, not per-block, so those keep the
# deny. `scripts/check_panic_policy.py` is the second layer: it catches what
# clippy has no lint for at all (`assert!`/`debug_assert!` families,
# `saturating_*`/`wrapping_*`), re-checks the forms clippy's `#[cfg(test)]`
# heuristic can still wrongly wave through on a standalone helper, and fails
# on any production `#[allow]`/`#[expect]` of a lint this table denies (see
# the script header).
#
# Test and bench crate roots (`benches/mod.rs`, each
# `benches/order_book/*_hdr.rs`, `benches/order_book/alloc_count.rs`,
# `tests/unit/mod.rs`, `tests/alloc_budget.rs`, `tests/metrics/mod.rs`,
# `tests/fee_tests.rs`, `tests/bincode_decode_bounds.rs`) carry their own
# crate-level `#![allow(...)]` for the lints without a `clippy.toml` "in
# tests" toggle (`arithmetic_side_effects`, `cast_possible_truncation`,
# `cast_sign_loss`, `cast_possible_wrap`, `manual_assert`,
# `panic_in_result_fn`, `get_unwrap`, `exit`, `unreachable`, `todo`,
# `unimplemented`); see each file's header comment. Co-located
# `#[cfg(test)] mod tests` blocks get the same relief, marked
# `// tests may panic: rules/global_rules.md § Testing`.
#
# NO production exceptions (issue #260): the temporary per-file
# `#![allow(clippy::...)]` ratchet markers and count ledgers used while
# #243-#259 fixed the pre-existing violations are gone. The policy is
# production-only; it deliberately does not restrict test or bench code.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
manual_assert = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"
exit = "deny"

[dependencies]
tracing = { workspace = true }
uuid = { workspace = true }
pricelevel = { workspace = true }
dashmap = { workspace = true }
crossbeam-skiplist = { workspace = true }
crossbeam = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
bitflags = { workspace = true }
thiserror = { workspace = true }
either = { workspace = true }
async-nats = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }


[features]
default = []
special_orders = []
nats = ["dep:async-nats", "dep:bytes"]
bincode = ["dep:bincode"]
journal = ["dep:crc32fast", "dep:memmap2"]
alloc-counters = []
metrics = ["dep:metrics"]
wire = ["dep:zerocopy"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
proptest = "1.11"
hdrhistogram = "7.6"

[[bench]]
name = "benches"
path = "benches/mod.rs"
harness = false

[[bench]]
name = "add_only_hdr"
path = "benches/order_book/add_only_hdr.rs"
harness = false

[[bench]]
name = "add_only_risk_hdr"
path = "benches/order_book/add_only_risk_hdr.rs"
harness = false

[[bench]]
name = "cancel_only_hdr"
path = "benches/order_book/cancel_only_hdr.rs"
harness = false

[[bench]]
name = "cancel_single_owner_hdr"
path = "benches/order_book/cancel_single_owner_hdr.rs"
harness = false

[[bench]]
name = "fill_single_owner_hdr"
path = "benches/order_book/fill_single_owner_hdr.rs"
harness = false

[[bench]]
name = "aggressive_walk_hdr"
path = "benches/order_book/aggressive_walk_hdr.rs"
harness = false

[[bench]]
name = "notional_walk_hdr"
path = "benches/order_book/notional_walk_hdr.rs"
harness = false

[[bench]]
name = "mixed_70_20_10_hdr"
path = "benches/order_book/mixed_70_20_10_hdr.rs"
harness = false

[[bench]]
name = "thin_book_sweep_hdr"
path = "benches/order_book/thin_book_sweep_hdr.rs"
harness = false

[[bench]]
name = "mass_cancel_burst_hdr"
path = "benches/order_book/mass_cancel_burst_hdr.rs"
harness = false

[[bench]]
name = "mass_cancel_by_user_hdr"
path = "benches/order_book/mass_cancel_by_user_hdr.rs"
harness = false

[[bench]]
name = "stp_sweep_hdr"
path = "benches/order_book/stp_sweep_hdr.rs"
harness = false

[[bench]]
name = "stp_contention_hdr"
path = "benches/order_book/stp_contention_hdr.rs"
harness = false

[[bench]]
name = "reserve_sweep_hdr"
path = "benches/order_book/reserve_sweep_hdr.rs"
harness = false

[[bench]]
name = "pending_stops_hdr"
path = "benches/order_book/pending_stops_hdr.rs"
harness = false
required-features = ["special_orders"]

[[bench]]
name = "alloc_count"
path = "benches/order_book/alloc_count.rs"
harness = false
required-features = ["alloc-counters"]

[[test]]
name = "tests"
path = "tests/unit/mod.rs"

[[test]]
name = "alloc_budget"
path = "tests/alloc_budget.rs"
required-features = ["alloc-counters"]

[[test]]
name = "bincode_decode_bounds"
path = "tests/bincode_decode_bounds.rs"
required-features = ["alloc-counters", "bincode"]

[[test]]
name = "metrics_tests"
path = "tests/metrics/mod.rs"
required-features = ["metrics"]


[lib]
name = "orderbook_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[workspace]
members = [
    "examples"
]

[workspace.dependencies]
orderbook-rs = { path = "." }
pricelevel = "0.10.2"
tracing = "0.1"
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
dashmap = "6.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.53", features = ["sync", "rt", "time"] }
crossbeam-skiplist = "0.1"
crossbeam = "0.8.5"
bitflags = { version = "2.13.2", features = ["serde"] }
thiserror = "2.0.21"
either = "1.18.0"
tracing-subscriber = "0.3"
async-nats = "0.50"
bytes = "1.12.1"
bincode = { version = "2.0", features = ["serde"] }
crc32fast = "1.5.2"
memmap2 = "0.9.11"
metrics = "0.24.6"
zerocopy = { version = "0.8.59", features = ["derive"]}

